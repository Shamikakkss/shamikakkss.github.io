<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlowA" cx="20%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowB" cx="85%" cy="82%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset="55%" stop-color="#0a0a0f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0.96"/>
    </linearGradient>
    
</defs>
  <style>
    .float { animation: floatShape 6s ease-in-out infinite; }
    @keyframes floatShape {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-22px) rotate(8deg); }
    }
    .draw { animation: drawStroke 4.5s ease-in-out infinite; }
    @keyframes drawStroke {
      0%   { stroke-dashoffset: 900; opacity: 0.9; }
      55%  { stroke-dashoffset: 0; opacity: 0.9; }
      85%  { stroke-dashoffset: 0; opacity: 0.9; }
      100% { stroke-dashoffset: -900; opacity: 0; }
    }
    .swatch { animation: swatchPulse 3.2s ease-in-out infinite; }
    @keyframes swatchPulse {
      0%,100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    </style>
