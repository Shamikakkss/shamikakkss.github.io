      85%  { width: var(--w); }
      100% { width: 0; }
    }
    .caret { animation: caretBlink 0.9s step-end infinite; }
    @keyframes caretBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    .cursorGlow { animation: cursorMove 12.8s linear infinite; }
    @keyframes cursorMove {
