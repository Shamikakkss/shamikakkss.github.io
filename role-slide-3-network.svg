</defs>
  <style>
    .ping { animation: pingRing 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pingRing {
      0%   { transform: scale(0.4); opacity: 0.55; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .packet { animation: flowDash 2.4s linear infinite; }
    @keyframes flowDash { to { stroke-dashoffset: -120; } }
    .radar { animation: radarSpin 5s linear infinite; transform-origin: 960px 540px; }
    @keyframes radarSpin { to { transform: rotate(360deg); } }
    .blink { animation: caretBlink 1.6s ease-in-out infinite; }
    @keyframes caretBlink { 0%,100% { opacity: 0.9; } 50% { opacity: 0.25; } }
    </style>
